name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Triggers the build whenever code is pushed to the main branch
  release:
    types: [published] # Alternatively, trigger when you publish a new version/release
  workflow_dispatch: # Allows manual triggering of the workflow from the GitHub Actions tab
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (highly recommended for advanced caching & performance)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to your internet-accessible private registry
      - name: Log in to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Step 4: Automatically handle tags and metadata (e.g., using commit SHA and 'latest')
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/stadsmiljo/400ip-lab/beredskapsvila  # Change 'my-app-name' to your desired repository name
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Step 5: Build the standalone production image and push it to the registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use a built-in GitHub cache so subsequent builds finish in seconds
          cache-from: type=gha
          cache-to: type=gha,mode=max
